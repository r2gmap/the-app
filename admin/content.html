<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content — Admin — The App</title>
    <meta name="description" content="Manage every game, app, website and offer on the platform." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#080a14" />

    <!-- Sets language and direction before first paint (see index.html). -->
    <script>
      (function () {
        try {
          var supported = ["en", "ar"];
          var stored = null;
          try { stored = localStorage.getItem("theapp.locale"); } catch (e) {}
          var locale = supported.indexOf(stored) > -1 ? stored : null;
          if (!locale) {
            var tags =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language];
            for (var i = 0; i < tags.length; i++) {
              var base = String(tags[i] || "").toLowerCase().split("-")[0];
              if (supported.indexOf(base) > -1) { locale = base; break; }
            }
          }
          locale = locale || "en";
          var root = document.documentElement;
          root.lang = locale;
          root.dir = locale === "ar" ? "rtl" : "ltr";
          if (locale !== "en") root.classList.add("i18n-pending");
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <script type="module" src="../js/admin/admin.js"></script>
  </head>

  <body class="admin-page" data-admin-page="content">
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <div class="admin-shell">
      <!-- ================================================ admin sidebar -->
      <aside class="admin-sidebar" id="admin-sidebar">
        <a class="brand" href="dashboard.html">
          <span class="brand__mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="3.5" y="14" width="4" height="6.5" rx="1.6" fill="#fff" fill-opacity=".62" />
                  <rect x="10" y="9.5" width="4" height="11" rx="1.6" fill="#fff" fill-opacity=".82" />
                  <rect x="16.5" y="4" width="4" height="16.5" rx="1.6" fill="#fff" />
                </svg>
          </span>
          <span class="brand__name">The App</span>
        </a>

        <div>
          <p class="admin-sidebar__heading" data-i18n="admin.shell.title">Admin panel</p>
          <nav class="admin-nav" aria-label="Admin" data-i18n-aria-label="admin.shell.title">
          <a class="admin-nav__link" href="dashboard.html" data-admin-nav-link="overview" data-i18n="admin.nav.overview">
            <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="2.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6"/></svg>
            <span>Overview</span>
          </a>
          <a class="admin-nav__link" href="content.html" data-admin-nav-link="content" data-i18n="admin.nav.content">
            <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M3 7h14" stroke="currentColor" stroke-width="1.6"/></svg>
            <span>Content</span>
          </a>
          <a class="admin-nav__link" href="submissions.html" data-admin-nav-link="submissions" data-i18n="admin.nav.submissions">
            <svg viewBox="0 0 20 20" fill="none"><path d="M5 3.5h10a1.5 1.5 0 011.5 1.5v11L15 14.5H5A1.5 1.5 0 013.5 13V5A1.5 1.5 0 015 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 7.5h6M7 10.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Submissions</span>
          </a>
          <a class="admin-nav__link" href="users.html" data-admin-nav-link="users" data-i18n="admin.nav.users">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 16c1-2.6 3-4 5.5-4s4.5 1.4 5.5 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15" cy="8.5" r="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M14.5 12.6c2 .2 3.4 1.4 4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Users</span>
          </a>
          <a class="admin-nav__link" href="wallet.html" data-admin-nav-link="wallet" data-i18n="admin.nav.wallet">
            <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="5" width="15" height="10.5" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 10.25h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>Wallet</span>
          </a>
          <a class="admin-nav__link" href="withdrawals.html" data-admin-nav-link="withdrawals" data-i18n="admin.nav.withdrawals">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5V10l2.5 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Withdrawals</span>
          </a>
          </nav>
        </div>

        <div class="admin-sidebar__footer">
          <a class="admin-nav__link" href="../index.html">
            <svg viewBox="0 0 20 20" fill="none">
              <path d="M8 3.5L3 10l5 6.5M3.8 10H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span data-i18n="admin.nav.viewSite">View website</span>
          </a>
          <button class="btn btn--ghost btn--sm" type="button" data-admin-logout data-i18n="admin.nav.logout">
            Log out
          </button>
        </div>
      </aside>

      <div class="admin-shell-column">
        <!-- ================================================ admin topbar -->
        <header class="admin-topbar">
          <button class="admin-trigger" type="button" data-admin-nav-trigger aria-expanded="false" aria-controls="admin-sidebar" aria-label="Open menu">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M3.5 6h13M3.5 10h13M3.5 14h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
          <p class="admin-topbar__title" data-i18n="admin.content.title">Content</p>
          <div class="admin-topbar__spacer"></div>
          <div class="lang-switch" data-lang-switch aria-label="Change language"></div>
          <div class="admin-topbar__user">
            <span class="admin-topbar__user-name" data-admin-user-name></span>
            <button class="btn btn--ghost btn--sm" type="button" data-admin-logout data-i18n="admin.nav.logout">
              Log out
            </button>
          </div>
        </header>

        <main class="admin-main" id="main">
          <!-- ============================================ page head -->
          <div class="page-head">
            <div>
              <h1 class="page-head__title" data-i18n="admin.content.title">Content management</h1>
              <p class="page-head__subtitle" data-i18n="admin.content.subtitle">
                Every game, app, website and offer on the platform — no code required.
              </p>
            </div>
          </div>

          <!-- ============================================ toolbar -->
          <div class="admin-toolbar">
            <div class="admin-toolbar__search">
              <input class="field__control" type="search" data-admin-content-search
                placeholder="Search content…" data-i18n-placeholder="admin.content.searchPlaceholder" />
            </div>
            <a class="btn btn--primary" href="content-form.html" data-i18n="admin.content.new">
              New content
            </a>
          </div>

          <!-- ============================================ filters -->
          <div class="tabs admin-filter-tabs" role="group" aria-label="Categories" data-admin-content-category-filters>
            <button class="tab__btn tab__btn--active" type="button" data-category-filter="all" data-i18n="categories.all">All</button>
            <button class="tab__btn" type="button" data-category-filter="game" data-i18n="nav.games">Games</button>
            <button class="tab__btn" type="button" data-category-filter="app" data-i18n="nav.apps">Apps</button>
            <button class="tab__btn" type="button" data-category-filter="website" data-i18n="nav.websites">Websites</button>
            <button class="tab__btn" type="button" data-category-filter="offer" data-i18n="nav.offers">Offers</button>
          </div>
          <div class="tabs admin-filter-tabs" role="group" aria-label="Status" data-admin-content-status-filters>
            <button class="tab__btn tab__btn--active" type="button" data-status-filter="all" data-i18n="admin.content.filter.all">All</button>
            <button class="tab__btn" type="button" data-status-filter="published" data-i18n="admin.content.published">Published</button>
            <button class="tab__btn" type="button" data-status-filter="draft" data-i18n="admin.content.draft">Draft</button>
          </div>

          <!-- ============================================ content list -->
          <div data-admin-content-status></div>
          <div class="admin-list" data-admin-content-list></div>
        </main>
      </div>
    </div>

    <!-- ============================================ content row template -->
    <!-- One row per content item: cover, title + badges, reward,
         display order (reorder arrows), status, row actions. -->
    <template id="admin-content-row-template">
      <div class="admin-row">
        <div class="admin-thumb" data-cr-thumb></div>
        <div class="admin-row__cell" style="flex:1.4; min-width:200px;">
          <span class="admin-row__value" data-cr-title style="font-size: var(--text-md);"></span>
          <span class="admin-row__badges">
            <span class="badge badge--primary" data-cr-category></span>
            <span class="badge badge--featured" data-cr-featured hidden data-i18n="common.featuredLabel">Featured</span>
          </span>
        </div>
        <div class="admin-row__cell">
          <span class="admin-row__label" data-i18n="offers.rewardLabel">Reward</span>
          <span class="admin-row__value amount--credit" data-cr-reward></span>
        </div>
        <div class="admin-row__cell">
          <span class="admin-row__label" data-i18n="admin.content.order">Order</span>
          <span class="admin-row__value admin-row__order">
            <button class="icon-btn" type="button" data-cr-up data-i18n-title="admin.content.moveUp" title="Move up">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 15V5m0 0l-4.5 4.5M10 5l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span data-cr-order></span>
            <button class="icon-btn" type="button" data-cr-down data-i18n-title="admin.content.moveDown" title="Move down">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 5v10m0 0l4.5-4.5M10 15l-4.5-4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </span>
        </div>
        <div class="admin-row__cell">
          <span class="badge" data-cr-status></span>
        </div>
        <div class="admin-row__actions">
          <button class="btn btn--secondary btn--sm" type="button" data-cr-toggle-publish></button>
          <button class="icon-btn" type="button" data-cr-toggle-featured data-i18n-title="admin.content.toggleFeatured" title="Toggle featured">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5l1.9 4 4.4.5-3.3 3 1 4.3-4-2.3-4 2.3 1-4.3-3.3-3 4.4-.5 1.9-4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </button>
          <a class="btn btn--ghost btn--sm" href="content-form.html" data-cr-edit data-i18n="common.edit">Edit</a>
          <button class="btn btn--danger btn--sm" type="button" data-cr-delete data-i18n="common.delete">Delete</button>
        </div>
      </div>
    </template>
  </body>
</html>
