<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview — Admin — The App</title>
    <meta name="description" content="Admin overview: users, offers, pending and approved reviews." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5f7fb" />

    <!-- Sets language and direction before first paint (see index.html). -->
    <script>
      (function () {
        try {
          var supported = ["en", "ar"];
          var stored = null;
          try { stored = localStorage.getItem("theapp.locale"); } catch (e) {}
          var locale = supported.indexOf(stored) > -1 ? stored : null;
          if (!locale) {
            var tags =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language];
            for (var i = 0; i < tags.length; i++) {
              var base = String(tags[i] || "").toLowerCase().split("-")[0];
              if (supported.indexOf(base) > -1) { locale = base; break; }
            }
          }
          locale = locale || "en";
          var root = document.documentElement;
          root.lang = locale;
          root.dir = locale === "ar" ? "rtl" : "ltr";
          if (locale !== "en") root.classList.add("i18n-pending");
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../components.css" />
    <link rel="stylesheet" href="../admin.css" />
    <link rel="stylesheet" href="../responsive.css" />
    <script type="module" src="../admin.js"></script>
  </head>

  <body class="admin-page" data-admin-page="submissions">
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <div class="admin-shell">
      <!-- ================================================ admin sidebar -->
      <aside class="admin-sidebar" id="admin-sidebar">
        <a class="brand" href="dashboard.html">
          <span class="brand__wordmark" aria-label="The App"><span class="brand__wordmark-muted">The</span><span class="brand__wordmark-main">App</span></span>
        </a>

        <div>
          <p class="admin-sidebar__heading" data-i18n="admin.shell.title">Admin panel</p>
          <nav class="admin-nav" aria-label="Admin" data-i18n-aria-label="admin.shell.title">
          <a class="admin-nav__link" href="dashboard.html" data-admin-nav-link="overview" data-i18n="admin.nav.overview">
            <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="2.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.6"/></svg>
            <span>Overview</span>
          </a>
          <a class="admin-nav__link" href="content.html" data-admin-nav-link="content" data-i18n="admin.nav.content">
            <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M3 7h14" stroke="currentColor" stroke-width="1.6"/></svg>
            <span>Content</span>
          </a>
          <a class="admin-nav__link" href="submissions.html" data-admin-nav-link="submissions" data-i18n="admin.nav.submissions">
            <svg viewBox="0 0 20 20" fill="none"><path d="M5 3.5h10a1.5 1.5 0 011.5 1.5v11L15 14.5H5A1.5 1.5 0 013.5 13V5A1.5 1.5 0 015 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 7.5h6M7 10.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Submissions</span>
          </a>
          <a class="admin-nav__link" href="users.html" data-admin-nav-link="users" data-i18n="admin.nav.users">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 16c1-2.6 3-4 5.5-4s4.5 1.4 5.5 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15" cy="8.5" r="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M14.5 12.6c2 .2 3.4 1.4 4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Users</span>
          </a>
          <a class="admin-nav__link" href="wallet.html" data-admin-nav-link="wallet" data-i18n="admin.nav.wallet">
            <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="5" width="15" height="10.5" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 10.25h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>Wallet</span>
          </a>
          <a class="admin-nav__link" href="withdrawals.html" data-admin-nav-link="withdrawals" data-i18n="admin.nav.withdrawals">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5V10l2.5 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Withdrawals</span>
          </a>
          </nav>
        </div>

        <div class="admin-sidebar__footer">
          <a class="admin-nav__link" href="../index.html">
            <svg viewBox="0 0 20 20" fill="none">
              <path d="M8 3.5L3 10l5 6.5M3.8 10H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span data-i18n="admin.nav.viewSite">View website</span>
          </a>
          <button class="btn btn--ghost btn--sm" type="button" data-admin-logout data-i18n="admin.nav.logout">
            Log out
          </button>
        </div>
      </aside>

      <div class="admin-shell-column">
        <!-- ================================================ admin topbar -->
        <header class="admin-topbar">
          <button class="admin-trigger" type="button" data-admin-nav-trigger aria-expanded="false" aria-controls="admin-sidebar" aria-label="Open menu">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M3.5 6h13M3.5 10h13M3.5 14h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
          <p class="admin-topbar__title" data-i18n="admin.overview.title">Overview</p>
          <div class="admin-topbar__spacer"></div>
          <div class="lang-switch" data-lang-switch aria-label="Change language"></div>
          <div class="admin-topbar__user">
            <span class="admin-topbar__user-name" data-admin-user-name></span>
            <button class="btn btn--ghost btn--sm" type="button" data-admin-logout data-i18n="admin.nav.logout">
              Log out
            </button>
          </div>
        </header>

        <main class="admin-main" id="main">
          <!-- ================================================= review queue -->
          <!-- The queue is intentionally operational: filter the work,
               inspect proof, then approve or reject without leaving the
               admin panel. Data and write actions stay in Firebase services. -->
          <div class="page-head">
            <div>
              <h1 class="page-head__title" data-i18n="admin.submissions.title">Submission review</h1>
              <p class="page-head__subtitle" data-i18n="admin.submissions.subtitle">Check proof, then approve to credit the reward — or reject with a reason.</p>
            </div>
          </div>
          <div class="tabs" role="group" aria-label="Submission status">
            <button class="tab__btn" type="button" data-admin-submission-filter="pending" data-i18n="status.pending">Pending</button>
            <button class="tab__btn" type="button" data-admin-submission-filter="approved" data-i18n="status.approved">Approved</button>
            <button class="tab__btn" type="button" data-admin-submission-filter="rejected" data-i18n="status.rejected">Rejected</button>
            <button class="tab__btn" type="button" data-admin-submission-filter="all" data-i18n="admin.submissions.filter.all">All</button>
          </div>
          <div data-admin-submissions-status></div>
          <div class="admin-list" data-admin-submissions-list></div>
        </main>

      </div>
    </div>

    <!-- Shared proof card template used by admin review actions. -->
    <template id="submission-card-template">
      <article class="card submission-card">
        <div class="submission-card__head">
          <div><p class="submission-card__offer" data-sub-offer></p><p class="submission-card__task" data-sub-task></p></div>
          <span class="badge" data-sub-status></span>
        </div>
        <div class="submission-card__meta">
          <span><span data-i18n="submissions.rewardLabel">Reward</span>: <span data-sub-reward></span></span>
          <span><span data-i18n="submissions.submittedLabel">Submitted</span>: <span data-sub-date></span></span>
        </div>
        <p class="submission-card__reason" data-sub-reason-block hidden><span data-i18n="submissions.reasonLabel">Reason</span>: <span data-sub-reason></span></p>
        <div class="submission-card__proof" data-sub-proof></div>
      </article>
    </template>

    <!-- Pending submission quick row (overview) -->
    <template id="admin-pending-row-template">
      <div class="admin-row">
        <div class="admin-row__cell" style="flex:1; min-width:180px;">
          <span class="admin-row__label" data-i18n="admin.submissions.user">User</span>
          <span class="admin-row__value" data-pr-user></span>
        </div>
        <div class="admin-row__cell" style="flex:1.2; min-width:180px;">
          <span class="admin-row__label" data-i18n="admin.submissions.offer">Offer</span>
          <span class="admin-row__value" data-pr-offer></span>
        </div>
        <div class="admin-row__cell" style="flex:1.4; min-width:200px;">
          <span class="admin-row__label" data-i18n="admin.submissions.taskTitle">Task title</span>
          <span class="admin-row__value" data-pr-task></span>
        </div>
        <div class="admin-row__cell">
          <span class="admin-row__label" data-i18n="submissions.rewardLabel">Reward</span>
          <span class="admin-row__value amount--credit" data-pr-reward></span>
        </div>
        <div class="admin-row__cell">
          <span class="admin-row__label" data-i18n="admin.submissions.submittedAt">Submitted</span>
          <span class="admin-row__value" data-pr-date></span>
        </div>
        <div class="admin-row__actions">
          <a class="btn btn--primary btn--sm" href="submissions.html" data-i18n="admin.submissions.approve">Review</a>
        </div>
      </div>
    </template>
  </body>
</html>
