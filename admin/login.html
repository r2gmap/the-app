<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin sign in — The App</title>
    <meta name="description" content="Administrator sign-in for The App." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#080a14" />

    <!-- Sets language and direction before first paint (see index.html). -->
    <script>
      (function () {
        try {
          var supported = ["en", "ar"];
          var stored = null;
          try { stored = localStorage.getItem("theapp.locale"); } catch (e) {}
          var locale = supported.indexOf(stored) > -1 ? stored : null;
          if (!locale) {
            var tags =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language];
            for (var i = 0; i < tags.length; i++) {
              var base = String(tags[i] || "").toLowerCase().split("-")[0];
              if (supported.indexOf(base) > -1) { locale = base; break; }
            }
          }
          locale = locale || "en";
          var root = document.documentElement;
          root.lang = locale;
          root.dir = locale === "ar" ? "rtl" : "ltr";
          if (locale !== "en") root.classList.add("i18n-pending");
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <script type="module" src="../js/admin/admin.js"></script>
  </head>

  <body class="admin-page auth-page" data-admin-page="login">
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <header>
      <div class="container auth-page__bar">
        <a class="brand" href="../index.html">
          <span class="brand__mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="3.5" y="14" width="4" height="6.5" rx="1.6" fill="#fff" fill-opacity=".62" />
                  <rect x="10" y="9.5" width="4" height="11" rx="1.6" fill="#fff" fill-opacity=".82" />
                  <rect x="16.5" y="4" width="4" height="16.5" rx="1.6" fill="#fff" />
                </svg>
          </span>
          <span class="brand__name">The App</span>
        </a>
        <div class="lang-switch" data-lang-switch aria-label="Change language"></div>
      </div>
    </header>

    <!-- ================================================== page content -->
    <main class="auth-page__main" id="main">
      <div class="card auth-card">
        <!-- ============================================ admin sign-in form -->
        <h1 class="auth-card__title" data-i18n="admin.loginTitle">Admin sign in</h1>
        <p class="auth-card__subtitle" data-i18n="admin.loginSubtitle">Administration access only.</p>

        <!-- ============================== credentials (email or username) -->
        <form class="form" data-admin-login-form novalidate>
          <div class="field">
            <label class="field__label" for="admin-identifier" data-i18n="admin.login.identifier">
              Email or username
            </label>
            <input class="field__control" id="admin-identifier" type="text" autocomplete="username" dir="ltr"
              placeholder="admin@example.com" data-i18n-placeholder="admin.login.identifierPlaceholder"
              data-admin-identifier />
          </div>
          <div class="field">
            <label class="field__label" for="admin-password" data-i18n="admin.login.password">Password</label>
            <input class="field__control" id="admin-password" type="password" autocomplete="current-password"
              data-admin-password />
          </div>
          <p class="form__error" role="alert" data-admin-login-error></p>

          <!-- ================================ submit + server-side feedback -->
          <button class="btn btn--primary btn--block" type="submit" data-i18n="admin.login.submit">
            Sign in
          </button>
        </form>

        <!-- ============================================ back-to-site link -->
        <p class="auth-card__footer">
          <a class="auth-card__link" href="../index.html" data-i18n="admin.login.backToSite">Back to website</a>
        </p>
      </div>
    </main>
  </body>
</html>
