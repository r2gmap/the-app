<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — The App</title>
    <meta name="i18n-title" content="error404.metaTitle" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Discover games and apps, complete simple tasks, and earn rewards once your proof is reviewed and approved."
    />
    <meta name="theme-color" content="#080a14" />

    <!-- Sets language and direction before first paint; see index.html. -->
    <script>
      (function () {
        try {
          var supported = ["en", "ar"];
          var stored = null;
          try { stored = localStorage.getItem("theapp.locale"); } catch (e) {}
          var locale = supported.indexOf(stored) > -1 ? stored : null;
          if (!locale) {
            var tags =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language];
            for (var i = 0; i < tags.length; i++) {
              var base = String(tags[i] || "").toLowerCase().split("-")[0];
              if (supported.indexOf(base) > -1) { locale = base; break; }
            }
          }
          locale = locale || "en";
          var root = document.documentElement;
          root.lang = locale;
          root.dir = locale === "ar" ? "rtl" : "ltr";
          if (locale !== "en") root.classList.add("i18n-pending");
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script type="module" src="js/main.js"></script>
  </head>

  <body class="auth-page">
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <!-- ============================================ minimal header -->
    <header>
      <div class="container auth-page__bar">
        <a class="brand" href="index.html">
          <svg class="brand__mark" viewBox="0 0 157 40" fill="none" role="img" aria-label="The App">
              <!-- Custom monoline wordmark: drawn letterforms on one
                   grid — "The" muted, "App" bright, accent full stop.
                   Colours/size live in the .brand__mark CSS rules. -->
              <g class="brand__mark-the" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 9H25M15 9V31" />
                <path d="M31 9V31M31 19C31 15.8 33.2 14.5 36 14.5C38.8 14.5 41 15.8 41 19V31" />
                <path d="M51 23.25H65M65 23.25A7 7 0 1 0 62.5 28.6" />
              </g>
              <g class="brand__mark-app" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M74 31L87 9L100 31M80 24H94" />
                <path d="M105 14.5V37M105 14.5C113.5 14.5 121 16.8 121 22.9C121 29 113.5 31.3 105 31.3" />
                <path d="M127 14.5V37M127 14.5C135.5 14.5 143 16.8 143 22.9C143 29 135.5 31.3 127 31.3" />
              </g>
              <circle class="brand__mark-dot" cx="151" cy="27.5" r="3.2" />
            </svg>
        </a>
        <div class="lang-switch" data-lang-switch aria-label="Change language"></div>
      </div>
    </header>

    <main class="auth-page__main" id="main">
      <!-- ============================================ not-found card -->
      <div class="card auth-card auth-card--centered">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 class="auth-card__title" data-i18n="error404.title">Page not found</h1>
        <p class="auth-card__subtitle" data-i18n="error404.body">
          The page you are looking for does not exist or may have moved.
        </p>
        <div class="auth-card__actions">
          <a class="btn btn--primary btn--block" href="index.html" data-i18n="error404.cta">
            Back to home
          </a>
          <a class="btn btn--secondary btn--block" href="offers.html" data-i18n="nav.offers">
            Offers
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
