<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — The App</title>
    <meta name="i18n-title" content="error404.metaTitle" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Discover games and apps, complete simple tasks, and earn rewards once your proof is reviewed and approved."
    />
    <meta name="theme-color" content="#080a14" />

    <!-- Sets language and direction before first paint; see index.html. -->
    <script>
      (function () {
        try {
          var supported = ["en", "ar"];
          var stored = null;
          try { stored = localStorage.getItem("theapp.locale"); } catch (e) {}
          var locale = supported.indexOf(stored) > -1 ? stored : null;
          if (!locale) {
            var tags =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language];
            for (var i = 0; i < tags.length; i++) {
              var base = String(tags[i] || "").toLowerCase().split("-")[0];
              if (supported.indexOf(base) > -1) { locale = base; break; }
            }
          }
          locale = locale || "en";
          var root = document.documentElement;
          root.lang = locale;
          root.dir = locale === "ar" ? "rtl" : "ltr";
          if (locale !== "en") root.classList.add("i18n-pending");
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script type="module" src="js/main.js"></script>
  </head>

  <body class="auth-page">
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <!-- ============================================ minimal header -->
    <header>
      <div class="container auth-page__bar">
        <a class="brand" href="index.html">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3.5" y="14" width="4" height="6.5" rx="1.6" fill="#fff" fill-opacity=".62" />
              <rect x="10" y="9.5" width="4" height="11" rx="1.6" fill="#fff" fill-opacity=".82" />
              <rect x="16.5" y="4" width="4" height="16.5" rx="1.6" fill="#fff" />
            </svg>
          </span>
          <span class="brand__name">The App</span>
        </a>
        <div class="lang-switch" data-lang-switch aria-label="Change language"></div>
      </div>
    </header>

    <main class="auth-page__main" id="main">
      <!-- ============================================ not-found card -->
      <div class="card auth-card" style="text-align: center;">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 class="auth-card__title" data-i18n="error404.title">Page not found</h1>
        <p class="auth-card__subtitle" data-i18n="error404.body">
          The page you are looking for does not exist or may have moved.
        </p>
        <div class="auth-card__actions">
          <a class="btn btn--primary btn--block" href="index.html" data-i18n="error404.cta">
            Back to home
          </a>
          <a class="btn btn--secondary btn--block" href="offers.html" data-i18n="nav.offers">
            Offers
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
